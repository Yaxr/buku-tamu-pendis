<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        #camera-container { width: 100%; max-width: 400px; margin-bottom: 10px; display: none; }
        video, canvas { width: 100%; border-radius: 8px; background: #ccc; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; width: 100%; }
        button:hover { background: #0056b3; }
        .hidden { display: none !important; }
        .rating-box { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <div id="guestbook-section">
        <h2>Buku Tamu</h2>
        <form id="guestForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Pesan / Keperluan</label>
                <textarea id="pesan" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Foto Selfie</label>
                <button type="button" id="start-camera" style="background:#28a745;">Aktifkan Kamera</button>
                <div id="camera-container">
                    <video id="video" autoplay playsinline></video>
                    <button type="button" id="snap" style="margin-top:5px; background:#dc3545;">Ambil Foto</button>
                </div>
                <canvas id="canvas" class="hidden"></canvas>
                <img id="photo-preview" src="" class="hidden" style="width:100%; margin-top:10px; border-radius:8px;">
            </div>
            <button type="submit" id="btn-submit">Kirim Kehadiran</button>
        </form>
    </div>

    <div id="rating-section" class="hidden class rating-box">
        <h3>Bagaimana Kunjungan Anda?</h3>
        <p>Halo <span id="visitor-name"></span>, Anda berkunjung sekitar 6 jam yang lalu. Mohon berikan penilaian Anda:</p>
        <div class="form-group">
            <label>Rating (1-5)</label>
            <input type="number" id="rating-val" min="1" max="5" placeholder="Contoh: 5" required>
        </div>
        <div class="form-group">
            <label>Ulasan Tambahan</label>
            <textarea id="ulasan-val" rows="2"></textarea>
        </div>
        <button type="button" id="btn-submit-rating">Kirim Rating</button>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHtRs9DhfU479AeGNEvqN5L-2Va8QhTO-yF-wL1Jo4AbkC8eDPnVciykEcAbS9_3Wq/exec";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photo-preview');
        const cameraContainer = document.getElementById('camera-container');
        let imageDataUrl = null;

        // Cek status kunjungan untuk memicu Rating 6 Jam
        window.addEventListener('DOMContentLoaded', checkVisitTiming);

        // Kamera Logic
        document.getElementById('start-camera').addEventListener('click', async () => {
            cameraContainer.style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            video.srcObject = stream;
        });

        document.getElementById('snap').addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            imageDataUrl = canvas.toDataURL('image/jpeg');
            photoPreview.src = imageDataUrl;
            photoPreview.classList.remove('hidden');
            
            // Matikan kamera setelah ambil foto
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
            cameraContainer.style.display = 'none';
        });

        // Submit Form Buku Tamu
        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!imageDataUrl) { alert("Silakan ambil foto selfie terlebih dahulu!"); return; }

            const btn = document.getElementById('btn-submit');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            const payload = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                pesan: document.getElementById('pesan').value,
                image: imageDataUrl
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Diperlukan untuk Google Apps Script Web App
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Simpan penanda waktu kunjungan di local storage untuk simulasi 6 jam
                localStorage.setItem('visitTime', Date.now());
                localStorage.setItem('visitorName', payload.nama);
                
                alert("Terima kasih sudah mengisi buku tamu!");
                document.getElementById('guestForm').reset();
                photoPreview.classList.add('hidden');
                imageDataUrl = null;
                btn.innerText = "Kirim Kehadiran";
                btn.disabled = false;

            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan saat mengirim data.");
                btn.innerText = "Kirim Kehadiran";
                btn.disabled = false;
            }
        });

        // Fungsi mengecek apakah sudah lewat 6 jam
        function checkVisitTiming() {
            const visitTime = localStorage.getItem('visitTime');
            const visitorName = localStorage.getItem('visitorName');
            
            if (visitTime && visitorName) {
                const now = Date.now();
                const sixHoursInMs = 6 * 60 * 60 * 1000; 
                
                // UNTUK TESTING: Ganti `sixHoursInMs` dengan 10000 (10 detik) untuk melihat apakah sistem bekerja
                if (now - visitTime >= sixHoursInMs) {
                    document.getElementById('guestbook-section').classList.add('hidden');
                    document.getElementById('rating-section').classList.remove('hidden');
                    document.getElementById('visitor-name').innerText = visitorName;
                }
            }
        }

        // Kirim Ulasan (Opsional: Silakan buat fungsi doGet/doPost tambahan di Apps Script jika ingin mengupdate rating ke baris sheet yang sama)
        document.getElementById('btn-submit-rating').addEventListener('click', () => {
            alert("Terima kasih atas rating dan ulasannya!");
            localStorage.clear(); // Hapus session data kunjungan
            location.reload();
        });
    </script>
</body>
</html>
