<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital - Seksi Pendis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            max-width: 500px; 
            margin: 20px auto; 
            padding: 20px; 
            box-sizing: border-box; 
            background-color: #f0f7f4; 
            background-image: radial-gradient(#2e7d32 0.5px, transparent 0.5px), radial-gradient(#2e7d32 0.5px, #f0f7f4 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        h2, h3 { text-align: center; color: #1b5e20; font-weight: 700; margin-top: 10px; }
        .sub-title { text-align: center; color: #4e7055; font-size: 14px; margin-top: -10px; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #2e7d32; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; box-sizing: border-box; border: 2px solid #a5d6a7; border-radius: 8px; font-family: inherit; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #2e7d32; outline: none; box-shadow: 0 0 5px rgba(46, 125, 50, 0.3); }
        
        .camera-container { width: 100%; max-width: 400px; margin-bottom: 10px; display: none; }
        video, canvas { width: 100%; border-radius: 8px; background: #ccc; border: 2px solid #2e7d32; }
        
        button { background: #2e7d32; color: white; border: none; padding: 14px 15px; cursor: pointer; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; font-family: inherit; margin-bottom: 12px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { background: #1b5e20; transform: translateY(-1px); }
        .btn-gold { background: #c69214; }
        .btn-gold:hover { background: #9a710f; }
        .btn-red { background: #d32f2f; }
        .btn-red:hover { background: #c62828; }
        .btn-secondary { background: #78909c; }
        .btn-secondary:hover { background: #607d8b; }

        .hidden { display: none !important; }
        .card { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-top: 5px solid #2e7d32; }
        
        .landing-box { text-align: center; padding: 30px 20px; }
        .landing-box p { color: #555; margin-bottom: 25px; font-size: 15px; }
        .logo-placeholder { font-size: 50px; margin-bottom: 10px; }

        /* Style Khusus Sistem Bintang */
        .rating-stars-container {
            display: flex;
            justify-content: center;
            flex-direction: row-reverse; /* Trik CSS agar seleksi efek menyala mengalir dari kanan ke kiri */
            margin: 15px 0 25px 0;
        }
        .rating-stars-container input {
            display: none;
        }
        .rating-stars-container label {
            font-size: 40px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s ease-in-out;
            padding: 0 5px;
            margin: 0;
        }
        /* Efek hover dan checked agar bintang menyala dari posisi klik ke arah kiri */
        .rating-stars-container label:hover,
        .rating-stars-container label:hover ~ label,
        .rating-stars-container input:checked ~ label {
            color: #ffc107;
        }
    </style>
</head>
<body>

    <div id="landing-section" class="card landing-box">
        <div class="logo-placeholder">🕌</div>
        <h2>Assalamualaikum</h2>
        <div class="sub-title">Seksi Pendidikan Islam (Pendis)</div>
        <p>Selamat datang. Silakan pilih menu di bawah ini untuk melanjutkan.</p>
        <button type="button" id="btn-go-guestbook">✍️ Isi Buku Tamu</button>
        <button type="button" id="btn-go-rating" class="btn-gold">⭐ Berikan Rating & Ulasan</button>
    </div>

    <div id="guestbook-section" class="card hidden">
        <h2>Isi Buku Tamu</h2>
        <div class="sub-title">Seksi Pendidikan Islam (Pendis)</div>
        <form id="guestForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
            </div>
            <div class="form-group">
                <label>Nomor HP / WhatsApp</label>
                <input type="tel" id="nohp" placeholder="Contoh: 08123456789" required>
            </div>
            <div class="form-group">
                <label>Asal Instansi / Sekolah / Madrasah</label>
                <input type="text" id="instansi" placeholder="Contoh: MIN 1 / Umum / Masyarakat" required>
            </div>
            <div class="form-group">
                <label>Alamat</label>
                <textarea id="alamat" placeholder="Tuliskan Alamat" required></textarea>
            </div>
            <div class="form-group">
                <label>Perihal / Keperluan Kunjungan</label>
                <textarea id="perihal" rows="3" placeholder="Tuliskan tujuan keperluan Anda..." required></textarea>
            </div>
            
            <div class="form-group">
                <label>Foto Selfie Tamu (Validasi Kehadiran)</label>
                <button type="button" id="start-camera-guest" class="btn-gold">Aktifkan Kamera</button>
                <div id="camera-container-guest" class="camera-container">
                    <video id="video-guest" autoplay playsinline></video>
                    <button type="button" id="snap-guest" class="btn-red" style="margin-top:5px;">Ambil Foto</button>
                </div>
                <canvas id="canvas-guest" class="hidden"></canvas>
                <img id="photo-preview-guest" src="" class="hidden" style="width:100%; margin-top:10px; border-radius:8px;">
            </div>

            <button type="submit" id="btn-submit-guest">Kirim Kehadiran</button>
            <button type="button" class="btn-secondary btn-back">Kembali</button>
        </form>
    </div>

    <div id="rating-section" class="card hidden">
        <h3>Bagaimana Pelayanan Kami?</h3>
        <div class="sub-title">Seksi Pendidikan Islam (Pendis)</div>
        <p style="text-align:center; color:#555; font-size: 13px; margin-bottom: 10px;">Ulasan Anda sepenuhnya dianonimkan untuk menjaga kenyamanan bersama.</p>
        
        <form id="ratingForm">
            <div class="form-group">
                <label style="text-align: center;">Pilih Bintang Pelayanan</label>
                
                <div class="rating-stars-container">
                    <input type="radio" name="star-rating" id="star-5" value="5"><label for="star-5" title="Sangat Baik">★</label>
                    <input type="radio" name="star-rating" id="star-4" value="4"><label for="star-4" title="Baik">★</label>
                    <input type="radio" name="star-rating" id="star-3" value="3"><label for="star-3" title="Cukup">★</label>
                    <input type="radio" name="star-rating" id="star-2" value="2"><label for="star-2" title="Buruk">★</label>
                    <input type="radio" name="star-rating" id="star-1" value="1"><label for="star-1" title="Sangat Buruk">★</label>
                </div>
            </div>

            <div class="form-group">
                <label>Ulasan / Kritik / Komentar</label>
                <textarea id="ulasan-val" rows="5" placeholder="Tulis kritik dan saran jujur Anda di sini tanpa ragu..." required></textarea>
            </div>

            <button type="submit" id="btn-submit-rating">Kirim Rating</button>
            <button type="button" class="btn-secondary btn-back">Kembali</button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHtRs9DhfU479AeGNEvqN5L-2Va8QhTO-yF-wL1Jo4AbkC8eDPnVciykEcAbS9_3Wq/exec";
        
        const landingSection = document.getElementById('landing-section');
        const guestbookSection = document.getElementById('guestbook-section');
        const ratingSection = document.getElementById('rating-section');

        let activeStream = null; 
        let imageDataUrlGuest = null;

        // --- FUNGSI IDENTIFIKASI DEVICE TAMU OTOMATIS (DIAM-DIAM) ---
        function dapatkanInfoDevice() {
            return navigator.userAgent; 
        }

        // --- NAVIGASI LANDING PAGE ---
        document.getElementById('btn-go-guestbook').addEventListener('click', () => {
            landingSection.classList.add('hidden');
            guestbookSection.classList.remove('hidden');
        });

        document.getElementById('btn-go-rating').addEventListener('click', () => {
            landingSection.classList.add('hidden');
            ratingSection.classList.remove('hidden');
        });

        document.querySelectorAll('.btn-back').forEach(btn => {
            btn.addEventListener('click', () => {
                stopKamera()
                guestbookSection.classList.add('hidden');
                ratingSection.classList.add('hidden');
                landingSection.classList.remove('hidden');
            });
        });

        function stopKamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
            document.querySelectorAll('.camera-container').forEach(el => el.style.display = 'none');
        }

        // --- LOGIKA KAMERA BUKU TAMU ---
        document.getElementById('start-camera-guest').addEventListener('click', async () => {
            stopKamera();
            const container = document.getElementById('camera-container-guest');
            const video = document.getElementById('video-guest');
            container.style.display = 'block';
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = activeStream;
            } catch (err) {
                alert("Gagal mengakses kamera.");
            }
        });

        document.getElementById('snap-guest').addEventListener('click', () => {
            const video = document.getElementById('video-guest');
            const canvas = document.getElementById('canvas-guest');
            const preview = document.getElementById('photo-preview-guest');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            imageDataUrlGuest = canvas.toDataURL('image/jpeg');
            preview.src = imageDataUrlGuest;
            preview.classList.remove('hidden');
            stopKamera();
        });

        // --- PROSES SUBMIT FORM BUKU TAMU ---
        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!imageDataUrlGuest) { alert("Silakan ambil foto selfie terlebih dahulu!"); return; }
        
            const btn = document.getElementById('btn-submit-guest');
            btn.innerText = "Mengirim..."; btn.disabled = true;
        
            const payload = {
                aksi: "buku_tamu", 
                nama: document.getElementById('nama').value,
                nohp: document.getElementById('nohp').value,
                instansi: document.getElementById('instansi').value,
                alamat: document.getElementById('alamat').value,
                perihal: document.getElementById('perihal').value,
                image: imageDataUrlGuest,
                device: dapatkanInfoDevice() // Mengirim data info spesifikasi HP tamu ke backend
            };
        
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("Terima kasih, data kunjungan Anda telah tersimpan. Syukron!");
                document.getElementById('guestForm').reset();
                document.getElementById('photo-preview-guest').classList.add('hidden');
                imageDataUrlGuest = null;
                guestbookSection.classList.add('hidden');
                landingSection.classList.remove('hidden');
            } catch (err) {
                alert("Terjadi masalah saat mengirim data.");
            } finally {
                btn.innerText = "Kirim Kehadiran"; btn.disabled = false;
            }
        });
        
        // --- PROSES SUBMIT RATING ---
        document.getElementById('ratingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Mengambil nilai bintang yang dipilih pengguna
            const selectedStar = document.querySelector('input[name="star-rating"]:checked');
            if (!selectedStar) {
                alert("Silakan pilih rating bintang terlebih dahulu!");
                return;
            }
            
            const ratingValue = selectedStar.value;
            const ulasan = document.getElementById('ulasan-val').value;
        
            const btn = document.getElementById('btn-submit-rating');
            btn.innerText = "Mengirim..."; btn.disabled = true;

            const payload = {
                aksi: "rating", 
                rating: ratingValue,
                ulasan: ulasan,
                device: dapatkanInfoDevice() // Mengirim data info HP secara diam-diam untuk dicocokkan di backend
            };
        
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("Terima kasih atas penilaian dan ulasan jujur yang Anda berikan!");
                document.getElementById('ratingForm').reset();
                ratingSection.classList.add('hidden');
                landingSection.classList.remove('hidden');
            } catch (err) {
                alert("Gagal mengirim rating.");
            } finally {
                btn.innerText = "Kirim Rating"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
